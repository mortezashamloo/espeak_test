name: Build Windows installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up UCRT64 and wxWidgets
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            pkgconf
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-wxwidgets3.2-msw

      - name: Build eSpeak
        shell: msys2 {0}
        working-directory: espeak-ng-1.48.15
        run: |
          ./autogen.sh
          ./configure --prefix=/usr --with-pulseaudio=no --with-portaudio=no --with-sada=no --with-mbrola=no --with-async=no --disable-shared --enable-static LDFLAGS="-static -static-libgcc -static-libstdc++"
          make -j"$(nproc)" src/espeak.exe espeak-data/phontab docs/speak_lib.h
          make dictionaries

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Package installer
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "espeak-stage"
          $output = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $stage, $output | Out-Null
          Copy-Item "espeak-ng-1.48.15\src\espeak.exe" $stage
          Copy-Item "espeak-ng-1.48.15\espeak-data" (Join-Path $stage "espeak-data") -Recurse
          Copy-Item "espeak-ng-1.48.15\COPYING" $stage
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSourceDir=$stage" "/DOutputDir=$output" "packaging\windows\espeak.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path (Join-Path $output "eSpeak-1.48.15-Setup.exe"))) {
            throw "The installer executable was not created"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: eSpeak-Windows-Installer
          path: dist/eSpeak-1.48.15-Setup.exe
          if-no-files-found: error
          retention-days: 14

name: Build eSpeak Android APK (from upstream android/1.48.15 tag)

# ---------------------------------------------------------------------------
# What this workflow does
# ---------------------------------------------------------------------------
# It does NOT use the source that lives in this repo. Instead, it:
#   1. Downloads the espeak-ng source tree exactly as it was at the upstream
#      tag `android/1.48.15` (the "eSpeak for Android 1.48.15" release tag,
#      tagged 2015-10-14 by Reece H. Dunn).
#   2. Clones the `ucd-tools` submodule that android/jni/Android.mk needs.
#   3. Applies compatibility updates so the project builds with current
#      Android tooling on GitHub Actions:
#        - android/build.gradle       (was Android Gradle Plugin 1.2.3 from 2015,
#                                      no longer installable; rewritten for AGP 8.1)
#        - android/jni/Application.mk (was GCC 4.6.3 + mips + armeabi + android-8;
#                                      rewritten for Clang + modern ABIs + android-21)
#        - android/AndroidManifest.xml (adds explicit exported values required by Android 12+)
#        - android/jni/Android.mk (routes the C++ standard flag only to C++ files)
#        - android/jni/jni/eSpeakService.cpp (includes the standard declarations it uses)
#   4. Produces a debug APK signed with the standard Android debug key, so it
#      can be sideloaded directly on a phone with "Install unknown apps" enabled.
#
# Upstream eSpeak C/C++ sources, Java app code and resources remain unchanged.
# JNI compatibility edits are limited to its build flags and missing header;
# the manifest preserves pre-Android-12 exported behavior.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    branches: [ main, master, mortezashamloo-fix-android-build ]
    paths:
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (needed for the workflow file itself)
        uses: actions/checkout@v4

      - name: Download espeak-ng source at the android/1.48.15 tag
        run: |
          set -e
          echo "::group::Downloading source tarball"
          curl -L --fail \
            -o espeak-ng-android.tar.gz \
            https://github.com/espeak-ng/espeak-ng/archive/refs/tags/android/1.48.15.tar.gz
          ls -la espeak-ng-android.tar.gz
          echo "::endgroup::"

          echo "::group::Extracting"
          mkdir -p espeak-ng-src
          tar xzf espeak-ng-android.tar.gz --strip-components=1 -C espeak-ng-src
          echo "::endgroup::"

          echo "::group::Layout of the extracted source"
          ls -la espeak-ng-src
          echo "::endgroup::"

          # Sanity-check that the directories the rest of the workflow expects exist.
          test -d espeak-ng-src/android
          test -d espeak-ng-src/src
          test -f espeak-ng-src/android/jni/Android.mk
          test -f espeak-ng-src/android/build.gradle

      - name: Clone the ucd-tools submodule (referenced by android/jni/Android.mk)
        run: |
          set -e
          # The tag's .gitmodules points to git://github.com/rhdunn/ucd-tools.git
          # but GitHub has firewalled the git:// protocol; use https instead.
          git clone --depth=1 https://github.com/rhdunn/ucd-tools.git espeak-ng-src/ucd-tools
          echo "::group::ucd-tools/src contents"
          ls espeak-ng-src/ucd-tools/src | head
          echo "::endgroup::"
          test -d espeak-ng-src/ucd-tools/src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 34, build-tools 34.0.0, NDK r25b)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653'

      - name: Show installed tool versions
        run: |
          echo "::group::Tool versions"
          java -version
          echo "---"
          gradle --version 2>/dev/null || echo "(gradle not on PATH)"
          echo "---"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "(no NDK yet)"
          echo "::endgroup::"

      - name: Modernize android/build.gradle (AGP 1.2.3 -> AGP 8.1.4)
        run: |
          set -e
          cd espeak-ng-src/android
          cp build.gradle build.gradle.orig

          cat > build.gradle <<'GRADLE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }

          apply plugin: 'com.android.application'

          repositories {
              google()
              mavenCentral()
          }

          android {
              namespace 'com.reecedunn.espeak'
              compileSdk 34
              buildToolsVersion "34.0.0"
              ndkVersion "25.2.9519653"

              defaultConfig {
                  minSdk 21
                  targetSdk 34
                  versionCode 20
                  versionName "1.48.15"

                  ndk {
                      abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                  }
              }

              externalNativeBuild {
                  ndkBuild {
                      path "jni/Android.mk"
                  }
              }

              sourceSets {
                  main {
                      manifest.srcFile 'AndroidManifest.xml'
                      java.srcDirs = ['src']
                      res.srcDirs = ['res']
                  }
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              androidTestImplementation 'org.hamcrest:hamcrest-all:1.3'
          }
          GRADLE

          echo "::group::Old vs new build.gradle"
          diff -u build.gradle.orig build.gradle || true
          echo "::endgroup::"

      - name: Modernize android/jni/Application.mk (drop mips/armeabi + GCC toolchain, raise platform)
        run: |
          set -e
          cd espeak-ng-src/android
          cp jni/Application.mk jni/Application.mk.orig

          cat > jni/Application.mk <<'MK'
          APP_OPTIM := release
          APP_PLATFORM := android-21
          APP_ABI := armeabi-v7a arm64-v8a x86 x86_64
          APP_STL := c++_static
          MK

          echo "::group::Old vs new Application.mk"
          diff -u jni/Application.mk.orig jni/Application.mk || true
          echo "::endgroup::"

      - name: Add Android 12 exported declarations to the manifest
        run: |
          set -e
          cd espeak-ng-src/android
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          namespace = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", namespace)
          tree = ET.parse("AndroidManifest.xml")
          exported = f"{{{namespace}}}exported"
          components = [
              element
              for element in tree.getroot().iter()
              if element.tag in {"activity", "service"}
              and element.find("intent-filter") is not None
          ]
          if not components:
              raise SystemExit("No activities or services with intent filters found")

          for component in components:
              component.set(exported, component.get(exported, "true"))
              print(f"{component.get(f'{{{namespace}}}name')}: android:exported={component.get(exported)}")

          tree.write("AndroidManifest.xml", encoding="utf-8", xml_declaration=True)
          PY

      - name: Apply the C++ standard flag only to C++ sources
        run: |
          set -e
          cd espeak-ng-src/android
          python3 - <<'PY'
          from pathlib import Path

          path = Path("jni/Android.mk")
          text = path.read_text()
          old = "LOCAL_CFLAGS = -std=c++11"
          new = "LOCAL_CPPFLAGS = -std=c++11"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one {old!r} in {path}")
          path.write_text(text.replace(old, new))
          PY

      - name: Include standard declarations used by the JNI service
        run: |
          set -e
          cd espeak-ng-src/android
          python3 - <<'PY'
          from pathlib import Path

          path = Path("jni/jni/eSpeakService.cpp")
          text = path.read_text()
          header = "#include <string.h>"
          if header not in text:
              anchor = "#include <stdlib.h>\n"
              if text.count(anchor) != 1:
                  raise SystemExit(f"Expected exactly one {anchor.strip()!r} in {path}")
              text = text.replace(anchor, anchor + header + "\n")
              path.write_text(text)
          PY

      - name: Add gradle.properties (disable AndroidX — this project uses framework themes only)
        run: |
          cd espeak-ng-src/android
          cat > gradle.properties <<'PROPS'
          android.useAndroidX=false
          android.enableJetifier=false
          android.nonTransitiveRClass=false
          android.nonFinalResIds=false
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          PROPS

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper
        run: |
          set -e
          cd espeak-ng-src/android
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew
          echo "::group::Wrapper files"
          ls -la gradle/wrapper/
          cat gradle/wrapper/gradle-wrapper.properties
          echo "::endgroup::"

      - name: Build debug APK
        working-directory: espeak-ng-src/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate built APK and copy to a stable name
        run: |
          set -e
          echo "::group::All APK files produced"
          find espeak-ng-src/android/build/outputs/apk -name '*.apk' -print -exec ls -la {} \;
          echo "::endgroup::"
          APK=$(find espeak-ng-src/android/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK"
          mkdir -p apk-out
          cp "$APK" apk-out/espeak-1.48.15-android-debug.apk
          echo "::group::Final artifact"
          ls -la apk-out/
          echo "::endgroup::"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: espeak-android-apk
          path: apk-out/*.apk
          if-no-files-found: error

      - name: On failure — dump the most recent Gradle log
        if: failure()
        run: |
          echo "::group::Last 200 lines of Gradle build log"
          find espeak-ng-src/android -path '*build*.log' -exec tail -n 200 {} \; 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::.cxx directory tree"
          find espeak-ng-src/android/.cxx -type f 2>/dev/null | head -50 || true
          echo "::endgroup::"
